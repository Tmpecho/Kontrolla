name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run backend formatting check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run backend tests with coverage
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Publish backend coverage summary
        run: |
          ruby -e '
            xml = File.read("build/reports/jacoco/test/jacocoTestReport.xml")
            total = xml.match(%r{<counter type="INSTRUCTION" missed="(\d+)" covered="(\d+)"/><counter type="BRANCH" missed="(\d+)" covered="(\d+)"/><counter type="LINE" missed="(\d+)" covered="(\d+)"/><counter type="COMPLEXITY" missed="(\d+)" covered="(\d+)"/><counter type="METHOD" missed="(\d+)" covered="(\d+)"/><counter type="CLASS" missed="(\d+)" covered="(\d+)"/></report>})
            rows = [
              ["Instruction", total[1].to_i, total[2].to_i],
              ["Branch", total[3].to_i, total[4].to_i],
              ["Line", total[5].to_i, total[6].to_i],
              ["Method", total[9].to_i, total[10].to_i],
              ["Class", total[11].to_i, total[12].to_i]
            ]

            File.open(ENV["GITHUB_STEP_SUMMARY"], "a") do |file|
              file.puts("## Backend coverage")
              file.puts("| Metric | Coverage |")
              file.puts("| --- | --- |")
              rows.each do |name, missed, covered|
                pct = covered * 100.0 / (missed + covered)
                file.puts("| #{name} | #{format("%.1f", pct)}% |")
              end
            end
          '

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint checks
        run: npm run lint:check

      - name: Run frontend build
        run: npm run build

      - name: Run frontend unit tests
        run: npm run test:unit:ci

  status:
    name: Status
    if: always()
    needs:
      - changes
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection job ended with: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$BACKEND_RESULT" != "success" && "$BACKEND_RESULT" != "skipped" ]]; then
            echo "Backend job ended with: $BACKEND_RESULT"
            exit 1
          fi

          if [[ "$FRONTEND_RESULT" != "success" && "$FRONTEND_RESULT" != "skipped" ]]; then
            echo "Frontend job ended with: $FRONTEND_RESULT"
            exit 1
          fi
