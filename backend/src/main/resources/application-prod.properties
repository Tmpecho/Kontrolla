spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
server.forward-headers-strategy=framework

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.refresh.secure-cookie=${APP_SECURITY_REFRESH_SECURE_COOKIE:true}
app.security.invite.frontend-base-url=${APP_SECURITY_INVITE_FRONTEND_BASE_URL}
app.security.invite.expose-invite-url-in-response=${APP_SECURITY_INVITE_EXPOSE_URL_IN_RESPONSE:false}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS}
app.mail.invites.enabled=${APP_MAIL_INVITES_ENABLED:true}
app.mail.invites.from-address=${APP_MAIL_INVITES_FROM_ADDRESS}
app.mail.invites.from-name=${APP_MAIL_INVITES_FROM_NAME:Kontrolla}
