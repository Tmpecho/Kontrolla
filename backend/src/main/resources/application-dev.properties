spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kontrolla}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kontrolla}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kontrolla}

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:change-me-change-me-change-me-change-me}
app.security.refresh.secure-cookie=${APP_SECURITY_REFRESH_SECURE_COOKIE:false}
app.security.invite.frontend-base-url=${APP_SECURITY_INVITE_FRONTEND_BASE_URL:http://localhost:5173}
app.security.invite.expose-invite-url-in-response=${APP_SECURITY_INVITE_EXPOSE_URL_IN_RESPONSE:true}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.mail.invites.enabled=${APP_MAIL_INVITES_ENABLED:false}
app.mail.invites.from-address=${APP_MAIL_INVITES_FROM_ADDRESS:no-reply@example.com}
app.mail.invites.from-name=${APP_MAIL_INVITES_FROM_NAME:Kontrolla}

app.security.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
app.security.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:password123}
app.security.bootstrap-admin.first-name=${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
app.security.bootstrap-admin.last-name=${APP_BOOTSTRAP_ADMIN_LAST_NAME:User}

app.security.bootstrap-user.email=${APP_BOOTSTRAP_USER_EMAIL:demo@example.com}
app.security.bootstrap-user.password=${APP_BOOTSTRAP_USER_PASSWORD:password123}
app.security.bootstrap-user.first-name=${APP_BOOTSTRAP_USER_FIRST_NAME:Demo}
app.security.bootstrap-user.last-name=${APP_BOOTSTRAP_USER_LAST_NAME:User}
app.security.bootstrap-employees[0].email=${APP_BOOTSTRAP_EMPLOYEE_ONE_EMAIL:emma.larsen@example.com}
app.security.bootstrap-employees[0].password=${APP_BOOTSTRAP_EMPLOYEE_ONE_PASSWORD:password123}
app.security.bootstrap-employees[0].first-name=${APP_BOOTSTRAP_EMPLOYEE_ONE_FIRST_NAME:Emma}
app.security.bootstrap-employees[0].last-name=${APP_BOOTSTRAP_EMPLOYEE_ONE_LAST_NAME:Larsen}
app.security.bootstrap-employees[1].email=${APP_BOOTSTRAP_EMPLOYEE_TWO_EMAIL:noah.berg@example.com}
app.security.bootstrap-employees[1].password=${APP_BOOTSTRAP_EMPLOYEE_TWO_PASSWORD:password123}
app.security.bootstrap-employees[1].first-name=${APP_BOOTSTRAP_EMPLOYEE_TWO_FIRST_NAME:Noah}
app.security.bootstrap-employees[1].last-name=${APP_BOOTSTRAP_EMPLOYEE_TWO_LAST_NAME:Berg}
app.security.bootstrap-organization.name=${APP_BOOTSTRAP_ORGANIZATION_NAME:Kontrolla Dev Org}
app.security.bootstrap-organization.status=${APP_BOOTSTRAP_ORGANIZATION_STATUS:ACTIVE}
app.security.bootstrap-establishment.name=${APP_BOOTSTRAP_ESTABLISHMENT_NAME:Kontrolla Demo Restaurant}
app.security.bootstrap-establishment.type=${APP_BOOTSTRAP_ESTABLISHMENT_TYPE:RESTAURANT}
app.security.bootstrap-establishment.status=${APP_BOOTSTRAP_ESTABLISHMENT_STATUS:ACTIVE}
